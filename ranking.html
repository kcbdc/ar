<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 랭킹</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell page-shell ranking-shell"><header class="page-top"><a href="index.html" class="back-btn">←</a><div><span class="section-kicker">HALL OF FAME</span><h1>원정대 랭킹</h1></div><div class="counter-pill">SVP</div></header><section class="rank-hero premium-card"><span class="rank-crown">♛</span><div><span>MY EXPEDITION SCORE</span><b id="myScore">0</b><small>플레이와 학습 기록을 바탕으로 산정</small></div></section><section class="rank-tabs"><button class="active">개인 랭킹</button><button>기관 대항전</button></section><section class="ranking-list" id="rankingList"></section><section class="impact-card"><span>🌱 누적 상생 기여</span><b id="impactValue">₩ 0</b><small id="carbonValue">탄소 감축 환산 0kg</small></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a class="active" href="ranking.html"><span>♛</span><b>랭킹</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a></nav><script src="assets/app.js"></script><script>
const rows=localLeaderboard();document.getElementById('rankingList').innerHTML=rows.map((r,i)=>`<article class="rank-row ${r.isMe?'me':''} ${i<3?'top top'+(i+1):''}"><div class="rank-no">${i<3?['🥇','🥈','🥉'][i]:(i+1)+'위'}</div><div class="rank-user"><b>${r.name}${r.isMe?' · MY':''}</b><small>${r.dept}</small></div><strong>${r.score.toLocaleString()}<small> SVP</small></strong></article>`).join('');const me=rows.find(x=>x.isMe);document.getElementById('myScore').textContent=(me?me.score:0).toLocaleString()+' SVP';const c=getProgress().length;document.getElementById('impactValue').textContent='₩ '+(c*1584000).toLocaleString();document.getElementById('carbonValue').textContent='탄소 감축 환산 '+(c*16.2).toFixed(1)+'kg';
</script></body></html>
