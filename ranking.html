<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 랭킹</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell page-shell ranking-shell"><header class="page-top"><a href="index.html" class="back-btn" aria-label="뒤로가기">←</a><div><span class="section-kicker">HALL OF FAME</span><h1>원정대 랭킹</h1></div><div class="counter-pill">SVP</div></header><section class="rank-hero premium-card"><span class="rank-crown">♛</span><div><span>MY EXPEDITION SCORE</span><b id="myScore">0</b><small id="rankMode">로컬 기록 기준</small></div></section><section class="rank-tabs"><button class="active" data-tab="personal">개인 랭킹</button><button data-tab="team">본부 대항전</button></section><section class="ranking-list" id="rankingList"></section><section class="impact-card"><span>🌱 플레이 기반 상생 지표</span><b id="impactValue">0 pt</b><small id="carbonValue">학습·탐험 활동을 게임 지표로 환산</small></section><section class="server-card premium-card compact"><div><span>LIVE RANKING</span><b>통합 랭킹 동기화</b><small id="serverState">현재 로컬 시연 모드</small></div><button id="syncBtn">동기화</button></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a class="active" href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/app.js"></script><script>
let tab='personal';function renderRows(rows){rankingList.innerHTML=rows.map((r,i)=>`<article class="rank-row ${r.isMe?'me':''} ${i<3?'top top'+(i+1):''}"><div class="rank-no">${i<3?['🥇','🥈','🥉'][i]:(i+1)+'위'}</div><div class="rank-user"><b>${r.name}${r.isMe?' · MY':''}</b><small>${r.dept||r.org||''}</small></div><strong>${Number(r.score||0).toLocaleString()}<small> SVP</small></strong></article>`).join('')}function render(){if(tab==='team'){renderRows(organizationLeaderboard().map(x=>({name:x.name,dept:'본부 대항전',score:x.score,isMe:x.name===getV3().org})));rankMode.textContent='본부별 합산 점수'}else{const rows=localLeaderboard();renderRows(rows);const me=rows.find(x=>x.isMe);myScore.textContent=(me?me.score:0).toLocaleString()+' SVP';rankMode.textContent=serverConfig()?'서버 연결 가능 · 동기화 대기':'로컬 기록 기준'}impactValue.textContent=missionScore().toLocaleString()+' pt';carbonValue.textContent='수집 '+getProgress().length+'종 · 학습 '+getEvents().filter(e=>e.type==='learn').length+'회 · 미니게임 '+getEvents().filter(e=>e.type==='minigame_success').length+'회'}document.querySelectorAll('.rank-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rank-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});if(serverConfig())serverState.textContent='서버 URL 설정됨';syncBtn.onclick=async()=>{syncBtn.disabled=true;serverState.textContent='동기화 중…';const r=await syncScoreToServer(),remote=await fetchServerLeaderboard();serverState.textContent=r.ok?'서버 동기화 완료':'로컬 모드 · 연결 실패/미설정';if(remote?.length){tab='personal';renderRows(remote);rankMode.textContent='LIVE SERVER'}syncBtn.disabled=false};render();</script></body></html>
