<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 랭킹</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/design-system-v18.css"><link rel="stylesheet" href="assets/design-system-v19.css"></head><body class="app-body"><main class="app-shell page-shell ranking-shell"><header class="page-top"><a href="index.html" class="back-btn" aria-label="뒤로가기">←</a><div><span class="section-kicker">HALL OF FAME</span><h1>원정대 랭킹</h1></div><div class="counter-pill">SVP</div></header><section class="rank-hero premium-card"><span class="rank-crown" data-ui-icon="trophy"></span><div><span>MY EXPEDITION SCORE</span><b id="myScore">0</b><small id="rankMode">로컬 기록 기준</small></div></section><section class="rank-motivation" id="rankMotivation"><div><span>전체</span><b id="overallRank">-</b></div><div><span>내 본부</span><b id="orgRank">-</b></div><div><span>이번 주</span><b id="weekRank">-</b></div></section><section class="rank-motivation performance" id="performanceStats"><div><span>연속 탐험</span><b id="streakStat">1일</b></div><div><span>지식 보너스</span><b id="learnStat">0회</b></div><div><span>포획 성공</span><b id="captureStat">0회</b></div></section><section class="rank-tabs"><button class="active" data-tab="personal">개인 랭킹</button><button data-tab="team">본부 대항전</button></section><section class="ranking-list" id="rankingList"></section><p class="empty-hint" id="emptyHint" style="display:none;font-size:11px;opacity:.6;text-align:center;margin:10px 0;">아직 나만 있어요 · 동료를 초대하거나 서버를 연결하면 실제 순위가 채워져요</p><section class="impact-card"><span><i data-ui-icon="growth"></i> 플레이 기반 상생 지표</span><b id="impactValue">0 pt</b><small id="carbonValue">학습·탐험 활동을 게임 지표로 환산</small></section><section class="server-card premium-card compact"><div><span>LIVE RANKING</span><b>통합 랭킹 동기화</b><small id="serverState">현재 로컬 시연 모드</small></div><button id="syncBtn">동기화</button></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a class="active" href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/state.js"></script><script src="assets/ui.js"></script><script src="assets/app.js"></script><script src="assets/liveops.js"></script><script>
let tab='personal';const stats=JopamsLive.stats();streakStat.textContent=fmtNum(getProfile().streak||1)+'일';learnStat.textContent=fmtNum(stats.learned)+'회';captureStat.textContent=fmtNum(getEvents().filter(e=>e.type==='minigame_success').length)+'회';function fmtRank(n){return (n===null||n===undefined)?'-':fmtNum(n)+'위'}
function fmtScore(n){return (n===null||n===undefined)?'데이터 없음':Number(n).toLocaleString()+' SVP'}
function renderRows(rows){rankingList.innerHTML=rows.map((r,i)=>`<article class="rank-row ${r.isMe?'me':''} ${i<3&&r.score!=null?'top top'+(i+1):''}"><div class="rank-no">${i<3&&r.score!=null?uiIcon('trophy'):(i+1)+'위'}</div><div class="rank-user"><b>${r.name}${r.isMe?' · MY':''}</b><small>${r.dept||r.org||''}</small></div><strong>${fmtScore(r.score)}</strong></article>`).join('');if(rows.length<=1&&!rows[0]?.score){emptyHint.style.display='block'}else{emptyHint.style.display='none'}}
async function render(){const mr=motivationRanks();overallRank.textContent=fmtRank(mr.overall);orgRank.textContent=fmtRank(mr.org);weekRank.textContent=fmtRank(mr.week);if(tab==='team'){const serverRows=serverConfig()?await organizationLeaderboardServer():null;const rows=serverRows||organizationLeaderboard();renderRows(rows.map(x=>({name:x.name,dept:'본부 대항전',score:x.score,isMe:x.name===getV3().org})));rankMode.textContent=serverRows?'서버 합산 점수 · LIVE':'로컬 기록 기준 (내 본부만 표시)'}else{const rows=localLeaderboard();renderRows(rows);const me=rows.find(x=>x.isMe);myScore.textContent=(me?me.score:0).toLocaleString()+' SVP';rankMode.textContent=serverConfig()?'서버 연결 가능 · 동기화 대기':'로컬 기록 기준'}impactValue.textContent=missionScore().toLocaleString()+' pt';carbonValue.textContent='수집 '+getProgress().length+'종 · 학습 '+getEvents().filter(e=>e.type==='learn').length+'회 · 미니게임 '+getEvents().filter(e=>e.type==='minigame_success').length+'회'}document.querySelectorAll('.rank-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rank-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});if(serverConfig())serverState.textContent='서버 URL 설정됨';syncBtn.onclick=async()=>{syncBtn.disabled=true;serverState.textContent='동기화 중…';const r=await syncScoreToServer(),remote=await fetchServerLeaderboard();serverState.textContent=r.ok?'서버 동기화 완료':'로컬 모드 · 연결 실패/미설정';if(remote?.length){tab='personal';renderRows(remote);rankMode.textContent='LIVE SERVER'}syncBtn.disabled=false};render();</script></body></html>
