<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 라이브 맵</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell page-shell map-shell"><header class="page-top"><a href="index.html" class="back-btn">←</a><div><span class="section-kicker">LIVE EXPEDITION MAP</span><h1>탐험 지도</h1></div><div class="counter-pill" id="gpsState">GPS</div></header><section class="live-map premium-card"><div class="map-grid"></div><div class="map-road r-a"></div><div class="map-road r-b"></div><div class="map-road r-c"></div><div class="map-building b1">본사</div><div class="map-building b2">연구동</div><div class="map-building b3">정원</div><div id="spotLayer"></div><div class="me-dot" id="meDot" hidden><i></i><span>나</span></div><div class="map-scan"></div><div class="map-legend"><span><i class="legend-dot me"></i>내 위치</span><span><i class="legend-dot open"></i>미발견</span><span><i class="legend-dot found"></i>발견</span></div></section><section class="nearby-card premium-card compact"><span class="section-kicker">NEAREST SIGNAL</span><div class="nearby-main"><span id="nearIcon">◎</span><div><b id="nearTitle">가장 가까운 신호 찾는 중</b><small id="nearDesc">위치 권한을 허용하면 거리를 표시합니다.</small></div><strong id="nearDist">--m</strong></div><a href="ar.html" class="sheet-primary">AR 탐험 시작</a></section><div class="filter-row"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="open">미발견</button><button class="filter" data-filter="done">발견</button></div><section class="spot-list" id="cpList"></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a class="active" href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/app.js"></script><script>
const lats=RAW_COORDS.map(x=>x[0]),lngs=RAW_COORDS.map(x=>x[1]),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs),done=getProgress(),layer=spotLayer,list=cpList;let mode='all',cur=null;function xy(lat,lng){return{x:8+(lng-minLng)/(maxLng-minLng)*84,y:8+(maxLat-lat)/(maxLat-minLat)*84}}CHECKPOINTS.forEach(cp=>{const ep=getEpisode(cp.episodeId),got=done.includes(ep.id),p=xy(cp.lat,cp.lng),b=document.createElement('button');b.className='map-spot '+(got?'found':'');b.style.left=p.x+'%';b.style.top=p.y+'%';b.innerHTML=got?ep.icon:'?';b.title=got?ep.item:'미발견 체크포인트';layer.appendChild(b)});function renderList(){list.innerHTML='';CHECKPOINTS.forEach(cp=>{const ep=getEpisode(cp.episodeId),got=done.includes(ep.id);if(mode==='open'&&got||mode==='done'&&!got)return;let d=cur?Math.round(distMeters(cur.lat,cur.lng,cp.lat,cp.lng)):null;const row=document.createElement('div');row.className='spot-row '+(got?'done':'');row.innerHTML=`<div class="spot-index">${got?'✓':String(cp.idx+1).padStart(2,'0')}</div><div class="spot-meta"><b>${got?ep.item:'미발견 체크포인트'}</b><small>${d!==null?d+'m 거리 · ':''}${got?'컬렉션 등록 완료':'AR 탐험에서 자동 안내'}</small></div><span class="spot-state">${got?'FOUND':'HIDDEN'}</span>`;list.appendChild(row)})}function updatePosition(pos){cur={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};gpsState.textContent='±'+Math.round(cur.accuracy)+'m';const p=xy(cur.lat,cur.lng);meDot.hidden=false;meDot.style.left=Math.max(2,Math.min(98,p.x))+'%';meDot.style.top=Math.max(2,Math.min(98,p.y))+'%';const n=nearestUncollectedCheckpoint(cur.lat,cur.lng);if(n){const ep=getEpisode(n.checkpoint.episodeId);nearIcon.textContent=ep.icon;nearTitle.textContent=ep.item+' 신호';nearDesc.textContent='가장 가까운 미발견 체크포인트';nearDist.textContent=Math.round(n.distance)+'m'}renderList()}if(navigator.geolocation)navigator.geolocation.watchPosition(updatePosition,()=>{gpsState.textContent='GPS OFF';renderList()},{enableHighAccuracy:true,maximumAge:1500,timeout:12000});renderList();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.filter;renderList()});
</script></body></html>
