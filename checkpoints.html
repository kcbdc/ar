const done=getProgress(),list=cpList;
let mode='all',cur=null,map=null,meMarker=null,markers=[];
let gpsSamples=[],lastGpsAt=0,gpsWatchId=null,gpsFallbackId=null,gpsRefreshTimer=null,recenterBusy=false,recenterRequestedAt=0,autoRecentered=false;
function setMapStatus(title,msg,show=true,showRetry=false){mapStatus.hidden=!show;if(show)mapStatus.innerHTML='<b>'+title+'</b><span>'+msg+'</span>'+(showRetry?'<button id="mapRetryBtn" class="map-retry-btn">다시 시도</button>':'');if(show&&showRetry){const btn=document.getElementById('mapRetryBtn');if(btn)btn.onclick=()=>{kakaoLoadAttempts=0;setMapStatus('카카오맵 재연결 중','잠시만 기다려 주세요…');loadKakaoWithRetry().then(ok=>{if(ok)initMap();else setMapStatus('카카오맵 연결 실패','JavaScript 키와 등록 도메인(jofams.pages.dev)을 확인해 주세요. 도메인을 방금 등록했다면 반영까지 1~2분 걸릴 수 있어요.',true,true)})}}}
function renderList(){list.innerHTML='';CHECKPOINTS.forEach(cp=>{const ep=getEpisode(cp.episodeId),got=done.includes(ep.id);if(mode==='open'&&got||mode==='done'&&!got)return;const d=cur?Math.round(distMeters(cur.lat,cur.lng,cp.lat,cp.lng)):null;const row=document.createElement('div');row.className='spot-row '+(got?'done':'');row.innerHTML=`<div class="spot-index">${got?'✓':String(cp.idx+1).padStart(2,'0')}</div><div class="spot-meta"><b>${got?ep.item:'미발견 체크포인트'}</b><small>${d!==null?fmtNum(d)+'m 거리 · ':''}${got?'컬렉션 등록 완료':'AR 탐험에서 자동 안내'}</small></div><span class="spot-state">${got?'FOUND':'HIDDEN'}</span>`;row.onclick=()=>{if(map&&window.kakao){const p=new kakao.maps.LatLng(cp.lat,cp.lng);map.panTo(p)}openKakao.href=kakaoMapLink(cp.lat,cp.lng,got?ep.item:'조팸스 GO 체크포인트')};list.appendChild(row)})}
// v20: 카카오맵 SDK 로딩 실패 시 자동 재시도(전파 지연·일시적 네트워크 오류 대응) +
// kakao.maps.load 콜백 내부 예외를 안전하게 처리해 Promise가 영영 응답하지 않는 상황을 방지.
let kakaoLoadAttempts=0;
function loadKakao(){
  const key=kakaoMapKey();
  if(!key){setMapStatus('카카오맵 키가 필요합니다','프로필·설정 → 카카오맵 연결에서 JavaScript 키를 등록해 주세요. 아래 "카카오맵에서 열기"는 바로 사용할 수 있습니다.');return Promise.resolve(false)}
  if(window.kakao&&kakao.maps)return Promise.resolve(true);
  return new Promise(resolve=>{
    const existing=document.getElementById('kakaoSdkScript');
    if(existing)existing.remove();
    const sc=document.createElement('script');
    sc.id='kakaoSdkScript';
    sc.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey='+encodeURIComponent(key);
    let settled=false;
    const finish=(ok)=>{if(settled)return;settled=true;resolve(ok)};
    sc.onload=()=>{
      try{ kakao.maps.load(()=>finish(true)); }
      catch(err){ console.error('카카오맵 SDK 초기화 오류:',err); finish(false); }
    };
    sc.onerror=(e)=>{ console.error('카카오맵 SDK 스크립트 로드 실패:',e); finish(false); };
    document.head.appendChild(sc);
    setTimeout(()=>finish(false),8000);
  });
}
async function loadKakaoWithRetry(){
  const ok=await loadKakao();
  if(ok)return true;
  kakaoLoadAttempts++;
  if(kakaoLoadAttempts<=2){
    setMapStatus('카카오맵 연결 재시도 중','네트워크 상태를 확인하고 있어요…');
    await new Promise(r=>setTimeout(r,2500));
    return loadKakaoWithRetry();
  }
  return false;
}
function initMap(){if(!window.kakao||!kakao.maps)return;const c=cur||{lat:CHECKPOINTS[0].lat,lng:CHECKPOINTS[0].lng};map=new kakao.maps.Map(kakaoMap,{center:new kakao.maps.LatLng(c.lat,c.lng),level:cur?3:4});kakao.maps.event.addListener(map,'dragstart',()=>{recenterRequestedAt=0;});const bounds=new kakao.maps.LatLngBounds();CHECKPOINTS.forEach(cp=>{const ep=getEpisode(cp.episodeId),got=done.includes(ep.id),pos=new kakao.maps.LatLng(cp.lat,cp.lng);bounds.extend(pos);const marker=new kakao.maps.Marker({position:pos,map,title:got?ep.item:'미발견 체크포인트'});kakao.maps.event.addListener(marker,'click',()=>{openKakao.href=kakaoMapLink(cp.lat,cp.lng,got?ep.item:'조팸스 GO 체크포인트');const content='<div class="map-marker-label">'+(got?ep.icon+' '+ep.item:'? 미발견 체크포인트')+'</div>';new kakao.maps.CustomOverlay({map,position:pos,content,yAnchor:1.55}).setMap(map)});markers.push(marker)});if(!cur)map.setBounds(bounds);else autoRecentered=true;setMapStatus('카카오맵 연결 완료','체크포인트와 현재 위치를 실시간으로 표시합니다.',true);setTimeout(()=>setMapStatus('','',false),1600);updateMapPosition()}
function updateMapPosition(){if(!map||!cur||!window.kakao)return;const pos=new kakao.maps.LatLng(cur.lat,cur.lng);if(!meMarker)meMarker=new kakao.maps.Marker({position:pos,map,title:'내 위치'});else meMarker.setPosition(pos);/* v32: GPS 갱신은 내 위치 마커만 갱신한다. 지도 중심은 사용자가 '내 위치로'를 눌렀을 때만 변경한다. */}
function updatePosition(pos){if(!pos||!pos.coords)return;const sample={lat:Number(pos.coords.latitude),lng:Number(pos.coords.longitude),accuracy:Math.max(1,Number(pos.coords.accuracy||999)),t:Date.now()};if(!Number.isFinite(sample.lat)||!Number.isFinite(sample.lng))return;gpsSamples.push(sample);if(gpsSamples.length>6)gpsSamples.shift();const recent=gpsSamples.filter(x=>sample.t-x.t<12000).sort((a,b)=>a.accuracy-b.accuracy).slice(0,4);let w=0,lat=0,lng=0;recent.forEach(x=>{const k=1/Math.max(8,x.accuracy);w+=k;lat+=x.lat*k;lng+=x.lng*k});cur={lat:lat/w,lng:lng/w,accuracy:Math.min(...recent.map(x=>x.accuracy))};lastGpsAt=Date.now();gpsState.textContent='±'+fmtNum(Math.round(cur.accuracy))+'m';
  // v45: "NEAREST SIGNAL" 카드가 위치를 받고도 계속 placeholder에 갇혀있던
  // 문제 수정. 원인이 무엇이든(모든 체크포인트가 쿨다운 중이거나, 12개를
  // 전부 수집했거나, 아이콘 렌더링 중 예외 등) 이 블록에서 예외가 나면
  // 화면이 절대 갱신되지 않았다. 1) 미수집 체크포인트가 없으면 재방문
  // 대상으로 자동 폴백하고, 2) 전체를 try/catch로 감싸 어떤 경우에도
  // 최소한 대략적인 안내 문구는 표시되도록 방어한다.
  try{
    let n=nearestUncollectedCheckpoint(cur.lat,cur.lng);
    let isRevisit=false;
    if(!n){n=nearestAnyCheckpoint(cur.lat,cur.lng);isRevisit=true;}
    if(n){
      const ep=getEpisode(n.checkpoint.episodeId);
      try{nearIcon.innerHTML=publicPurchaseIcon(ep.id,true);}catch(e){nearIcon.textContent=ep.icon||'◎';}
      nearTitle.textContent=ep.item+(isRevisit?' 재방문':' 신호');
      nearDesc.textContent=isRevisit?'수집 완료 · 재방문 가능 지점':(cur.accuracy>40?'GPS 보정 중 · 가장 가까운 체크포인트':'가장 가까운 미발견 체크포인트');
      nearDist.textContent=fmtNum(Math.round(n.distance))+'m';
      openKakao.href=kakaoMapLink(n.checkpoint.lat,n.checkpoint.lng,ep.item);
    }else{
      nearTitle.textContent='모든 체크포인트 완료';
      nearDesc.textContent='주변에 표시할 지점이 없어요';
      openKakao.href=kakaoMapLink(cur.lat,cur.lng,'내 위치');
    }
  }catch(e){
    nearTitle.textContent='신호 확인 중 오류';
    nearDesc.textContent='잠시 후 다시 시도해 주세요';
    openKakao.href=kakaoMapLink(cur.lat,cur.lng,'내 위치');
  }
  updateMapPosition();
  // v46: 지도 화면에 다시 들어왔을 때(또는 처음 GPS를 받았을 때) 매번 "내
  // 위치로"를 눌러야 했던 불편함을 없앤다. 카카오맵이 이미 떠 있는 상태에서
  // 첫 위치를 수신하면 자동으로 내 위치를 중심으로 한 번 이동시키고, 그
  // 이후로는(사용자가 지도를 둘러보는 중일 수 있으므로) 자동으로 다시
  // 이동시키지 않는다 — 위치가 실제와 다르면 "내 위치로" 버튼으로 수동
  // 보정하면 된다.
  if(!autoRecentered&&map&&window.kakao){
    autoRecentered=true;
    try{
      const p=new kakao.maps.LatLng(cur.lat,cur.lng);
      map.setCenter(p);
      map.setLevel(3,{anchor:p});
    }catch(e){}
  }
  renderList()}
function startGpsTracking(){
  if(!navigator.geolocation){gpsState.textContent='GPS N/A';return}
  const fine={enableHighAccuracy:true,maximumAge:1000,timeout:12000};
  const fast={enableHighAccuracy:false,maximumAge:15000,timeout:4000};
  navigator.geolocation.getCurrentPosition(updatePosition,()=>{},fast);
  if(gpsWatchId===null)gpsWatchId=navigator.geolocation.watchPosition(updatePosition,e=>{
    gpsState.textContent=e&&e.code===1?'권한 필요':'재탐색';
    setMapStatus(e&&e.code===1?'위치 권한 확인 필요':'GPS 신호 재탐색 중',e&&e.code===1?'브라우저에서 위치 접근을 허용해 주세요.':'잠시 후 자동으로 다시 연결합니다.');
    renderList();
  },fine);
  if(gpsFallbackId===null)gpsFallbackId=navigator.geolocation.watchPosition(p=>{if(Date.now()-lastGpsAt>4500)updatePosition(p)},()=>{},fast);
  if(gpsRefreshTimer===null)gpsRefreshTimer=setInterval(()=>{
    if(!document.hidden&&Date.now()-lastGpsAt>10000)navigator.geolocation.getCurrentPosition(updatePosition,()=>{},fine)
  },8000);
}
function centerMapOnCurrentLocation(position){
  // 버튼 재중앙화에서는 평균 GPS가 아니라 방금 수신한 실측 좌표를 우선한다.
  if(position&&position.coords){
    const lat=Number(position.coords.latitude),lng=Number(position.coords.longitude),accuracy=Math.max(1,Number(position.coords.accuracy||999));
    if(Number.isFinite(lat)&&Number.isFinite(lng)){cur={lat,lng,accuracy};lastGpsAt=Date.now();gpsSamples=[{lat,lng,accuracy,t:lastGpsAt}];gpsState.textContent='±'+fmtNum(Math.round(accuracy))+'m';}
  }
  if(!(map&&cur&&window.kakao))return false;
  recenterRequestedAt=0;
  const myPos=new kakao.maps.LatLng(cur.lat,cur.lng);
  try{map.relayout()}catch(e){}
  updateMapPosition();
  // setBounds/pan 애니메이션 상태와 무관하게 현재 위치를 강제로 중심점으로 확정한다.
  map.setCenter(myPos);
  map.setLevel(3,{anchor:myPos});
  setTimeout(()=>{if(map&&cur){try{map.relayout()}catch(e){}const p=new kakao.maps.LatLng(cur.lat,cur.lng);map.setCenter(p);map.setLevel(3,{anchor:p})}},120);
  setTimeout(()=>{if(map&&cur){const p=new kakao.maps.LatLng(cur.lat,cur.lng);map.setCenter(p)}},450);
  openKakao.href=kakaoMapLink(cur.lat,cur.lng,'내 위치');
  renderList();
  return true;
}
async function recenterToMe(){
  if(recenterBusy)return;
  if(!map||!window.kakao){setMapStatus('지도 준비 중','카카오맵 연결이 완료되면 내 위치로 이동합니다.');return}
  recenterBusy=true;
  const originalText=recenterBtn.textContent;
  recenterBtn.disabled=true;
  recenterBtn.textContent='위치 확인 중…';
  // 기존 위치가 있으면 즉시 이동시켜 버튼 반응을 먼저 보여준다.
  if(cur)centerMapOnCurrentLocation();
  if(!navigator.geolocation){
    recenterBtn.disabled=false;recenterBtn.textContent=originalText;recenterBusy=false;return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    centerMapOnCurrentLocation(pos);
    setMapStatus('내 위치로 이동했습니다','현재 위치를 지도 중심으로 표시합니다.',true);
    setTimeout(()=>setMapStatus('','',false),900);
    recenterBtn.disabled=false;recenterBtn.textContent=originalText;recenterBusy=false;
  },err=>{
    if(!cur)setMapStatus(err&&err.code===1?'위치 권한이 필요합니다':'현재 위치를 찾지 못했습니다',err&&err.code===1?'브라우저 위치 권한을 허용한 뒤 다시 눌러 주세요.':'GPS 신호가 잡히는 곳에서 다시 시도해 주세요.',true);
    recenterBtn.disabled=false;recenterBtn.textContent=originalText;recenterBusy=false;
  },{enableHighAccuracy:true,maximumAge:0,timeout:8000});
}
loadKakaoWithRetry().then(ok=>{if(ok)initMap();else if(kakaoMapKey())setMapStatus('카카오맵 연결 실패','JavaScript 키와 등록 도메인(jofams.pages.dev)을 확인해 주세요. 도메인을 방금 등록했다면 반영까지 1~2분 걸릴 수 있어요.',true,true)});
startGpsTracking();
window.addEventListener('pagehide',()=>{try{if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);if(gpsFallbackId!==null)navigator.geolocation.clearWatch(gpsFallbackId);if(gpsRefreshTimer!==null)clearInterval(gpsRefreshTimer)}catch(e){}});
recenterBtn.onclick=recenterToMe;
renderList();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.filter;renderList()});
</script>
<script>
(function(){
  const bgm=document.getElementById('mapBgm');
  const btn=document.getElementById('mapBgmToggle');
  if(!bgm||!btn)return;
  const KEY='jopams-map-bgm-on';
  const TARGET=0.16;
  let wanted=localStorage.getItem(KEY)==='1';
  let fadeTimer=null;

  function setUI(playing){
    btn.classList.toggle('on',playing);
    btn.setAttribute('aria-pressed',playing?'true':'false');
  }
  function fadeIn(){
    clearInterval(fadeTimer);
    bgm.volume=0.03;
    fadeTimer=setInterval(()=>{
      bgm.volume=Math.min(TARGET,bgm.volume+0.015);
      if(bgm.volume>=TARGET)clearInterval(fadeTimer);
    },80);
  }
  btn.addEventListener('click',()=>{
    wanted=!wanted;
    localStorage.setItem(KEY,wanted?'1':'0');
    if(wanted){
      bgm.play().then(()=>{setUI(true);fadeIn()}).catch(()=>setUI(false));
    }else{
      clearInterval(fadeTimer);
      bgm.pause();
      setUI(false);
    }
  });
  if(wanted){
    setUI(true);
    const resume=()=>{
      if(wanted&&bgm.paused)bgm.play().then(()=>{bgm.volume=TARGET}).catch(()=>{});
      document.removeEventListener('pointerdown',resume);
    };
    document.addEventListener('pointerdown',resume,{once:true});
  }
})();
</script>
</body></html>
