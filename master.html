<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | MASTER MODE</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/design-system-v18.css"><link rel="stylesheet" href="assets/design-system-v19.css"></head><body class="app-body"><main class="app-shell page-shell master-shell"><header class="page-top"><a href="collection.html" class="back-btn" aria-label="뒤로가기">←</a><div><span class="section-kicker">MASTER MODE</span><h1>공공구매 마스터</h1></div><span class="counter-pill" id="masterScore">0%</span></header><section class="premium-card master-intro"><span class="master-mark" data-ui-icon="trophy"></span><h2>게임에서 배운 지식을 실전에 적용하세요</h2><p>12개 제도를 모두 발견한 뒤 열리는 사례형 테스트입니다. 80점 이상이면 마스터 보상을 획득합니다.</p></section><section class="premium-card master-question" id="masterCard"><span class="section-kicker" id="qNo">CASE 01 / 05</span><h2 id="qText">문제를 준비하고 있어요.</h2><div class="master-options" id="qOptions"></div><p id="qExplain" style="min-height:44px;color:#9fb6cd;font-size:12px;line-height:1.55"></p><button class="sheet-primary" id="qNext" disabled>다음 사례</button></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a class="active" href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/state.js"></script><script src="assets/ui.js"></script><script src="assets/app.js"></script><script src="assets/liveops.js"></script><script>
const cases=[
{q:'새 기술을 개발했지만 공공조달 실적이 부족한 혁신 제품의 첫 판로를 지원하는 제도는?',o:['시범구매제품','보훈기업제품','여성기업제품'],a:0,e:'시범구매는 성능이 우수하지만 초기 조달 실적이 부족한 혁신제품의 공공시장 진입을 지원합니다.'},
{q:'지역사회 문제 해결과 사회적 가치 실현을 핵심 목적으로 하는 기업의 제품이라면?',o:['사회적기업제품','기술개발제품','녹색제품'],a:0,e:'사회적기업은 사회적 목적과 가치를 추구하면서 영업활동을 수행합니다.'},
{q:'NET·NEP 등 기술혁신 성과가 있는 제품의 공공시장 진입을 돕는 영역은?',o:['기술개발제품','창업기업제품','장애인기업제품'],a:0,e:'기술개발제품은 기술혁신 성과를 공공조달 판로와 연결하는 제도입니다.'},
{q:'환경부하와 자원·에너지 소비를 줄이는 제품 구매와 가장 직접적으로 연결되는 것은?',o:['녹색제품','사회적협동조합','중소기업제품'],a:0,e:'녹색제품 구매는 친환경 생산·소비와 자원 효율을 촉진합니다.'},
{q:'근로 여건이 취약한 중증장애인의 직업재활과 고용 확대를 직접 지원하는 구매 제도는?',o:['중증장애인생산품','장애인기업제품','여성기업제품'],a:0,e:'중증장애인생산품 우선구매는 지정 생산시설의 판로를 지원해 직업재활과 고용에 기여합니다.'}
];let i=0,correct=0,locked=false;const unlocked=JopamsLive.collectionMastery().unlocked;if(!unlocked){qText.textContent='MASTER MODE가 아직 잠겨 있습니다.';qExplain.textContent='12개 공공구매 제도를 모두 발견하면 도전할 수 있습니다.';qNext.textContent='컬렉션으로 돌아가기';qNext.disabled=false;qNext.onclick=()=>location.href='collection.html'}else render();function render(){locked=false;qNext.disabled=true;qExplain.textContent='';qNo.textContent='CASE '+String(i+1).padStart(2,'0')+' / '+String(cases.length).padStart(2,'0');qText.textContent=cases[i].q;qOptions.innerHTML=cases[i].o.map((x,n)=>`<button data-i="${n}">${x}</button>`).join('');qOptions.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}function answer(n){if(locked)return;locked=true;const c=cases[i];qOptions.querySelectorAll('button').forEach((b,x)=>{if(x===c.a)b.classList.add('correct');else if(x===n)b.classList.add('wrong');b.disabled=true});if(n===c.a){correct++;playSfx('success');vibrate([20,20,50])}else playSfx('fail');qExplain.textContent=c.e;masterScore.textContent=Math.round(correct/(i+1)*100)+'%';qNext.disabled=false;qNext.textContent=i===cases.length-1?'결과 확인':'다음 사례'}qNext.addEventListener('click',()=>{if(!unlocked)return;i++;if(i<cases.length){render();return}const r=JopamsLive.masterComplete(correct,cases.length);qNo.textContent=r.passed?'MASTER CLEAR':'RETRY';qText.textContent=r.passed?'공공구매 마스터 달성!':'조금만 더 복습해볼까요?';qOptions.innerHTML='';qExplain.textContent=`최종 점수 ${r.score}점 · ${r.passed?'500 XP + 300 C 획득':'80점 이상이면 마스터 보상을 획득합니다.'}`;qNext.textContent=r.passed?'원정본부로 이동':'다시 도전';qNext.disabled=false;qNext.onclick=()=>r.passed?location.href='expedition.html':location.reload()});
</script></body></html>
