<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 시즌패스</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell page-shell"><header class="page-top"><a href="index.html" class="back-btn" aria-label="뒤로가기">←</a><div><span class="section-kicker gold-text">SEASON 01 · PUBLIC QUEST</span><h1>공공구매 마스터 패스</h1></div><div class="counter-pill" id="coinChip">0 C</div></header><section class="pass-hero premium-card"><div><span>SEASON PROGRESS</span><b id="seasonLevel">LV. 1</b><small id="seasonXp">0 XP</small></div><div class="pass-orb">🏆</div></section><section class="pass-track-wrap"><div class="pass-track"><i id="fill"></i></div><div class="pass-label"><span>START</span><span>2,100 XP</span></div></section><section class="tier-list" id="tiers"></section><div class="reward-reveal" id="rewardReveal" aria-hidden="true"><div class="reward-reveal-card"><div class="reward-rays"></div><span class="reward-top">SEASON REWARD</span><div class="reward-big" id="revealIcon">🎁</div><h2 id="revealName">보상 획득!</h2><p id="revealDesc">시즌 보상이 인벤토리에 추가되었습니다.</p><button id="revealClose">확인</button></div></div><p class="legal-note">시즌 보상은 이 시연 버전의 게임 내 보상이며 금전적 가치가 없습니다.</p></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/state.js"></script><script src="assets/ui.js"></script><script src="assets/app.js"></script><script>
function render(){const s=seasonState(),v=getV4(),max=SEASON_TIERS.at(-1).xp;coinChip.textContent=fmtNum(v.coins||0)+' C';seasonLevel.textContent='LV. '+playerLevel();seasonXp.textContent=s.xp.toLocaleString()+' XP';fill.style.width=Math.min(100,s.xp/max*100)+'%';tiers.innerHTML=s.tiers.map(t=>`<article class="tier-card ${t.unlocked?'unlocked':''} ${t.claimed?'claimed':''}"><div class="tier-no"><small>TIER</small><b>${String(t.tier).padStart(2,'0')}</b></div><div class="tier-reward"><span>${t.icon}</span><div><b>${t.name}</b><small>${t.xp.toLocaleString()} XP · ${t.reward}</small></div></div>${t.tier===1?'<em class="tier-state">기본</em>':t.claimed?'<em class="tier-state done">✓ 획득</em>':t.unlocked?`<button onclick="take(${t.tier})">받기</button>`:'<em class="tier-state">LOCK</em>'}</article>`).join('')}
function take(t){const tier=SEASON_TIERS.find(x=>x.tier===Number(t));if(claimSeasonTier(t)){playSfx('chest');vibrate([30,30,80,30,120]);revealIcon.textContent=tier.icon;revealName.textContent=tier.name;revealDesc.textContent=tier.reward+' 보상을 획득했습니다.';rewardReveal.classList.add('show');rewardReveal.setAttribute('aria-hidden','false');render()}}revealClose.onclick=()=>{rewardReveal.classList.remove('show');rewardReveal.setAttribute('aria-hidden','true')};render();</script></body></html>
