<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>조팸스 원정대 AR - GPS 체크포인트</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body>

<div class="ar-topbar">
  <a href="index.html">← 나가기</a>
  <span class="ep-tag" id="epTag">탐색 중...</span>
</div>

<div class="ar-instructions" id="instructions">
  위치 권한을 허용하면 근처 체크포인트를 자동으로 찾아드려요
</div>

<div class="dist-pill" id="distPill" style="display:none;"></div>

<div class="dwell-ring-wrap" id="dwellRing" style="display:none;">
  <svg viewBox="0 0 74 74">
    <circle class="dwell-ring-bg" cx="37" cy="37" r="33"></circle>
    <circle class="dwell-ring-fg" id="dwellFg" cx="37" cy="37" r="33"></circle>
  </svg>
  <div class="dwell-icon" id="dwellIcon">📍</div>
</div>

<div id="permGate" class="perm-gate">
  <div class="perm-card">
    <div class="perm-icon">📍✨</div>
    <h2>위치 & 카메라 권한이 필요해요</h2>
    <p>본사 곳곳의 체크포인트에 가까워지면 자동으로 캐릭터가 나타나요.<br>
       마커나 스캔 없이, 그냥 걸어가기만 하면 됩니다!</p>
    <button id="permStartBtn">AR 탐험 시작하기</button>
    <div class="perm-note" id="permNote"></div>
  </div>
</div>

<div class="card-overlay" id="cardOverlay">
  <div class="get-card">
    <div class="tag" id="cardTag">ITEM 01 / 12</div>
    <div class="icon" id="cardIcon">🏭</div>
    <div class="name" id="cardName">중소기업제품</div>
    <div class="quote" id="cardQuote">"이거 만든 사람이 누구게?"</div>
    <div class="all-done-badge" id="allDoneBadge" style="display:none;">🎉 12개 전체 수집 완료!</div>
    <button id="cardNextBtn">다음 체크포인트로</button>
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 480; sourceHeight: 640; displayWidth: 480; displayHeight: 640;">

  <a-assets>
    <img id="charSunsik" src="assets/img/sunsik.png" crossorigin="anonymous">
    <img id="charDaim" src="assets/img/daim.png" crossorigin="anonymous">
    <img id="charHoonmin" src="assets/img/hoonmin.png" crossorigin="anonymous">
  </a-assets>

  <a-camera gps-camera="gpsMinDistance: 5;" rotation-reader></a-camera>

  <!-- 40개 체크포인트가 여기 JS로 동적 생성됩니다 -->
  <a-entity id="gpsEntities"></a-entity>

</a-scene>

<script src="assets/app.js"></script>
<script>
  const charImgById = { sunsik: '#charSunsik', daim: '#charDaim', hoonmin: '#charHoonmin' };
  const charOrder = ['sunsik','daim','hoonmin'];

  // ---- gps-entity-place 엔티티를 40개 체크포인트에 동적 생성 ----
  const gpsRoot = document.getElementById('gpsEntities');
  CHECKPOINTS.forEach((cp, i) => {
    const ep = getEpisode(cp.episodeId);
    const charKey = charOrder[i % 3];

    const wrap = document.createElement('a-entity');
    wrap.setAttribute('gps-entity-place', `latitude: ${cp.lat}; longitude: ${cp.lng};`);
    wrap.setAttribute('id', 'cp-' + cp.idx);

    const img = document.createElement('a-image');
    img.setAttribute('src', charImgById[charKey]);
    img.setAttribute('width', '6');
    img.setAttribute('height', '9');
    img.setAttribute('look-at', '[gps-camera]');
    wrap.appendChild(img);

    const label = document.createElement('a-text');
    label.setAttribute('value', ep.icon + ' ' + ep.item);
    label.setAttribute('align', 'center');
    label.setAttribute('color', '#ffffff');
    label.setAttribute('width', '14');
    label.setAttribute('position', '0 5 0');
    label.setAttribute('look-at', '[gps-camera]');
    wrap.appendChild(label);

    gpsRoot.appendChild(wrap);
  });

  // ---- 권한 요청 & 시작 ----
  const permGate = document.getElementById('permGate');
  const permNote = document.getElementById('permNote');
  const startBtn = document.getElementById('permStartBtn');

  async function requestOrientationPermission(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      try{
        const res = await DeviceOrientationEvent.requestPermission();
        return res === 'granted';
      }catch(e){ return false; }
    }
    return true; // Android 등: 별도 권한 요청 불필요
  }

  startBtn.addEventListener('click', async () => {
    permNote.textContent = '권한 요청 중...';
    const oriOk = await requestOrientationPermission();
    if(!oriOk){
      permNote.textContent = '방향 센서 권한이 거부되었어요. 브라우저 설정에서 허용 후 새로고침 해주세요.';
      return;
    }
    if(!navigator.geolocation){
      permNote.textContent = '이 브라우저는 위치 정보를 지원하지 않아요.';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      () => { permGate.style.display = 'none'; startTracking(); },
      (err) => { permNote.textContent = '위치 권한이 거부되었어요 (' + err.message + '). 브라우저 설정에서 허용 후 새로고침 해주세요.'; },
      { enableHighAccuracy: true }
    );
  });

  // ---- 근접 판정 & 3초 dwell 로직 ----
  const instructions = document.getElementById('instructions');
  const distPill = document.getElementById('distPill');
  const dwellRing = document.getElementById('dwellRing');
  const dwellFg = document.getElementById('dwellFg');
  const dwellIcon = document.getElementById('dwellIcon');
  const epTag = document.getElementById('epTag');
  const CIRC = 2 * Math.PI * 33;

  let dwellStart = null;
  let dwellTargetEpId = null;
  let dwellRAF = null;
  let watchId = null;

  function tick(){
    if(dwellStart === null) return;
    const elapsed = performance.now() - dwellStart;
    const pct = Math.min(elapsed / DWELL_MS, 1);
    dwellFg.style.strokeDashoffset = String(CIRC * (1 - pct));
    if(pct >= 1){ onCollect(dwellTargetEpId); return; }
    dwellRAF = requestAnimationFrame(tick);
  }

  function startTracking(){
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  }

  function onPosError(err){
    instructions.textContent = '위치 신호를 받는 중입니다... (' + err.message + ')';
  }

  function onPosition(pos){
    const { latitude, longitude } = pos.coords;
    const done = getProgress();

    if(done.length >= 12){
      instructions.textContent = '🎉 12개 아이템을 모두 모았어요!';
      dwellRing.style.display = 'none';
      distPill.style.display = 'none';
      epTag.textContent = '원정 완료';
      return;
    }

    const nearest = nearestUncollectedCheckpoint(latitude, longitude);
    if(!nearest){ return; }

    const { checkpoint, distance } = nearest;
    const ep = getEpisode(checkpoint.episodeId);
    epTag.textContent = 'EP.' + ep.id + ' · ' + ep.item;

    distPill.style.display = 'block';
    distPill.textContent = '가장 가까운 체크포인트까지 약 ' + Math.round(distance) + 'm';

    if(distance <= RADIUS_M){
      dwellRing.style.display = 'block';
      instructions.textContent = '체크포인트 근처예요! 카메라를 들고 3초간 주변을 비춰보세요';
      if(dwellStart === null || dwellTargetEpId !== ep.id){
        dwellStart = performance.now();
        dwellTargetEpId = ep.id;
        dwellIcon.textContent = '✨';
        cancelAnimationFrame(dwellRAF);
        dwellRAF = requestAnimationFrame(tick);
      }
    } else {
      dwellRing.style.display = 'none';
      dwellStart = null;
      dwellTargetEpId = null;
      cancelAnimationFrame(dwellRAF);
      dwellFg.style.strokeDashoffset = String(CIRC);
      instructions.textContent = '체크포인트 방향으로 걸어가 보세요 (' + Math.round(distance) + 'm 남음)';
    }
  }

  function onCollect(epId){
    dwellStart = null;
    cancelAnimationFrame(dwellRAF);
    const ep = getEpisode(epId);
    const done = markCollected(epId);

    document.getElementById('cardTag').textContent = 'ITEM ' + String(ep.id).padStart(2,'0') + ' / 12';
    document.getElementById('cardIcon').textContent = ep.icon;
    document.getElementById('cardName').textContent = ep.item;
    document.getElementById('cardQuote').textContent = '"' + ep.quote + '"';
    document.getElementById('cardOverlay').classList.add('show');

    if(done.length >= 12){
      document.getElementById('allDoneBadge').style.display = 'block';
      document.getElementById('cardNextBtn').textContent = '명예의 전당으로';
    } else {
      document.getElementById('allDoneBadge').style.display = 'none';
      document.getElementById('cardNextBtn').textContent = '다음 체크포인트로';
    }
  }

  document.getElementById('cardNextBtn').addEventListener('click', () => {
    document.getElementById('cardOverlay').classList.remove('show');
  });

  // ---- 초기 확대 표시 버그 방지 (기존 마커 버전과 동일 조치) ----
  const sceneEl = document.querySelector('a-scene');
  function forceRelayout(){ window.dispatchEvent(new Event('resize')); }
  sceneEl.addEventListener('loaded', () => {
    [100, 400, 900, 1600].forEach(ms => setTimeout(forceRelayout, ms));
  });
  window.addEventListener('orientationchange', () => setTimeout(forceRelayout, 300));
</script>

</body>
</html>
