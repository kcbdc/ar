<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 본부 대항전</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/design-system-v18.css"><link rel="stylesheet" href="assets/design-system-v19.css"><script src="assets/auth.js"></script></head><body class="app-body"><main class="app-shell ranking-shell"><header class="sub-header"><a href="index.html" class="back-btn" aria-label="뒤로가기">←</a><div><small>TEAM BATTLE</small><h1>본부 대항전</h1></div><span>SEASON 01</span></header><section class="battle-hero premium-card"><span class="battle-kicker">WEEKLY EXPEDITION CUP</span><h2>우리 팀을 정상으로</h2><p>AR 발견·미니게임·학습 XP가 소속 본부 점수에 반영됩니다.</p><div class="org-picker"><label>내 소속</label><select id="orgSelect"><option>본사</option><option>화폐본부</option><option>제지본부</option><option>ID본부</option><option>기술연구원</option></select></div><div class="battle-share-actions"><button id="shareBattleBtn" type="button"><span data-ui-icon="share"></span><b>현재 결과 공유</b></button><button id="inviteBattleBtn" type="button"><span data-ui-icon="friend"></span><b>동료 초대</b></button></div></section><section class="team-list"  id="teamList"></section><section class="premium-card compact battle-info"><b>이번 시즌 점수</b><div><span>내 원정 점수</span><strong id="myScore">0</strong></div><small id="serverHint">현재 버전은 기기 내 기록으로 즉시 시연되며, 서버 URL 연결 시 전사 통합 랭킹으로 전환됩니다.</small></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/state.js"></script><script src="assets/ui.js?v=87"></script><script src="assets/app.js"></script><script>const sel=document.getElementById('orgSelect');sel.value=getV3().org||'본사';async function render(){const serverRows=serverConfig()?await organizationLeaderboardServer():null;const rows=serverRows||organizationLeaderboard();const leaderScore=rows.find(r=>r.score!=null)?.score??null;teamList.innerHTML=rows.map((r,i)=>`<div class="team-row ${r.name===getV3().org?'mine':''}"><span class="team-rank">${i+1}</span><div><b>${r.name}</b><small>${r.score==null?'집계 데이터 없음':(leaderScore!=null&&r.score===leaderScore?'현재 선두':'선두와 '+(leaderScore-r.score).toLocaleString()+'점 차이')}</small></div><strong>${r.score==null?'-':r.score.toLocaleString()}</strong></div>`).join('');myScore.textContent=missionScore().toLocaleString();serverHint.textContent=serverRows?'서버에 연결되어 전체 본부의 실제 합산 점수를 보여주고 있어요.':'현재 버전은 기기 내 기록으로 즉시 시연되며, 서버 URL 연결 시 전사 통합 랭킹으로 전환됩니다. 다른 본부 점수는 서버 연결 전까지 표시되지 않아요.'}sel.onchange=()=>{setOrganization(sel.value);render();showToast('<b>'+sel.value+'</b> 팀으로 설정했어요',{variant:'near'});syncScoreToServer()};render();
async function shareBattleResult(){
 const rows=(serverConfig()?await organizationLeaderboardServer():null)||organizationLeaderboard();
 const mine=rows.find(r=>r.name===getV3().org),rank=Math.max(1,rows.findIndex(r=>r.name===getV3().org)+1);
 const score=mine?.score??missionScore();
 const text=`조팸스 GO 본부 대항전 · ${getV3().org} 현재 ${rank}위 · ${Number(score||0).toLocaleString()}점! 우리 본부 함께 달려요!`;
 const data={title:'조팸스 GO 본부 대항전',text,url:location.origin+'/'};
 try{if(navigator.share){await navigator.share(data);return true}await navigator.clipboard.writeText(text+' '+data.url);return true}catch(e){return false}
}
shareBattleBtn.onclick=async()=>showToast(await shareBattleResult()?'본부 대항전 결과를 공유했습니다':'공유 기능을 사용할 수 없습니다',{variant:'near'});
inviteBattleBtn.onclick=async()=>showToast(await JopamsLive.inviteFriend()?'동료 초대 링크를 준비했습니다':'공유 기능을 사용할 수 없습니다',{variant:'near'});
</script></body></html>
