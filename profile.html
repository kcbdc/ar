<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 프로필</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell page-shell"><header class="page-top"><a href="index.html" class="back-btn">←</a><div><span class="section-kicker">PLAYER & SETTINGS</span><h1>프로필 · 설정</h1></div><div class="counter-pill">LV.<span id="lv">1</span></div></header><section class="profile-hero premium-card"><div class="avatar-select"><button data-avatar="hoonmin"><img src="assets/img/hoonmin.png"></button><button data-avatar="daim"><img src="assets/img/daim.png"></button><button data-avatar="sunsik"><img src="assets/img/sunsik.png"></button></div><label>닉네임<input id="nick" maxlength="14" placeholder="원정대원"></label><label>소속<select id="org"><option>본사</option><option>화폐본부</option><option>제지본부</option><option>ID본부</option><option>기술연구원</option></select></label><button class="sheet-primary" id="saveProfileBtn">프로필 저장</button></section><section class="settings-list premium-card compact"><div class="setting-row"><span>🔊<b>효과음</b><small>포획·보상 효과음</small></span><label class="switch"><input id="sound" type="checkbox"><i></i></label></div><div class="setting-row"><span>📳<b>진동 피드백</b><small>근접·획득 알림</small></span><label class="switch"><input id="haptics" type="checkbox"><i></i></label></div><div class="setting-row"><span>◌<b>동작 줄이기</b><small>애니메이션 최소화</small></span><label class="switch"><input id="motion" type="checkbox"><i></i></label></div><button class="setting-action" id="tutorial">↻ 첫 실행 가이드 다시 보기</button></section><section class="privacy-center premium-card compact"><span class="section-kicker">PRIVACY CENTER</span><h2>개인정보 최소 수집 설계</h2><div class="privacy-grid" id="privacyGrid"></div></section><section class="server-setup premium-card compact"><span class="section-kicker">LIVE SERVICE</span><h2>랭킹 서버 연결</h2><p>Cloudflare Worker 배포 주소를 입력하면 실제 통합 랭킹과 동기화할 수 있습니다.</p><input id="serverUrl" placeholder="https://your-worker.workers.dev"><div class="server-buttons"><button id="saveServer">URL 저장</button><button id="testServer">연결 진단</button></div><small id="serverMsg">미설정 시 모든 기능은 로컬 모드로 동작합니다.</small></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/app.js"></script><script>
const p=getProfile(),v=getV4(),v3=getV3();lv.textContent=playerLevel();nick.value=p.name;org.value=v3.org||'본사';sound.checked=v.sound;haptics.checked=v.haptics;motion.checked=v.reducedMotion;serverUrl.value=serverConfig();document.querySelectorAll('[data-avatar]').forEach(b=>{b.classList.toggle('active',b.dataset.avatar===(p.avatar||'daim'));b.onclick=()=>document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.toggle('active',x===b))});saveProfileBtn.onclick=()=>{const active=document.querySelector('[data-avatar].active');updatePlayer({name:nick.value,org:org.value,avatar:active?.dataset.avatar});showToast('프로필을 저장했습니다',{variant:'near'})};sound.onchange=()=>setPref('sound',sound.checked);haptics.onchange=()=>setPref('haptics',haptics.checked);motion.onchange=()=>setPref('reducedMotion',motion.checked);tutorial.onclick=()=>{resetOnboarding();location.href='index.html'};const ps=privacySummary();privacyGrid.innerHTML=`<div>📷<b>카메라</b><small>${ps.camera}</small></div><div>📍<b>위치</b><small>${ps.location}</small></div><div>🧭<b>센서</b><small>${ps.sensor}</small></div><div>♛<b>랭킹</b><small>${ps.ranking}</small></div>`;saveServer.onclick=()=>{setServerUrl(serverUrl.value);serverMsg.textContent=serverConfig()?'서버 URL을 저장했습니다.':'로컬 모드로 설정했습니다.'};testServer.onclick=async()=>{serverMsg.textContent='연결 확인 중…';const r=await testServerConnection(serverUrl.value);serverMsg.textContent=r.message;if(r.ok)setServerUrl(serverUrl.value)};
</script></body></html>
