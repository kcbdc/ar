<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#152942"><title>조팸스 GO | 컬렉션</title><link rel="stylesheet" href="assets/style.css">
</head>
<body class="app-body">
<main class="app-shell page-shell">
  <header class="page-top"><a href="index.html" class="icon-btn">←</a><div><span class="section-kicker">DISCOVERY BOOK</span><h1>공공구매 컬렉션</h1></div><span class="counter-pill" id="counter">0/12</span></header>
  <section class="collection-hero premium-card compact"><div><span class="section-kicker">YOUR PROGRESS</span><h2 id="collectionHeadline">첫 발견을 시작해보세요</h2><p>수집한 아이템은 언제든 다시 보고 핵심 제도를 복습할 수 있어요.</p></div><div class="mini-ring" id="miniRing"><b id="miniCount">0</b><small>/12</small></div></section>
  <section class="collection-grid" id="collectionGrid"></section>
  <div class="bottom-spacer"></div>
</main>
<nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a class="active" href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav>
<div class="sheet" id="itemSheet" aria-hidden="true"><button class="sheet-dim" data-close-sheet></button><div class="sheet-card"><div class="sheet-handle"></div><div class="item-detail"><div class="detail-icon modern-detail-icon" id="detailIcon"></div><span class="section-kicker" id="detailTag">ITEM 01 / 12</span><h2 id="detailName">중소기업제품</h2><p id="detailQuote"></p><div class="learning-box"><b>10초 핵심</b><p id="detailLearn"></p></div></div><button class="sheet-primary" data-close-sheet>컬렉션으로 돌아가기</button></div></div>
<script src="assets/app.js"></script>
<script>
const learn = {
1:'공공기관의 구매력을 활용해 중소기업의 판로 확대와 경쟁력 강화를 지원하는 공공구매 영역입니다.',
2:'기술개발 성과가 있는 제품의 시장 진입을 돕고 혁신적인 제품의 공공판로를 확대하는 제도입니다.',
3:'여성기업의 판로 확대를 위해 기업 요건과 제품·실적 인정기준을 확인해 구매하는 제도입니다.',
4:'장애인이 소유하거나 경영에 참여하는 기업의 판로 확대와 경제활동을 지원하는 제도입니다.',
5:'중증장애인의 직업재활과 일자리 확대를 위해 지정 생산시설의 제품을 우선 구매하는 제도입니다.',
6:'사회적 목적을 추구하는 기업의 제품·서비스 구매를 통해 사회적 가치를 확산합니다.',
7:'취약계층의 자립과 일자리 창출을 돕는 자활기업의 제품·서비스 구매를 촉진합니다.',
8:'구성원이 공동으로 소유·운영하는 협동조합의 제품을 통해 지역·사회적 가치를 지원합니다.',
9:'지역 주민이 주도하는 마을기업의 제품을 구매해 지역경제와 공동체 활성화를 돕습니다.',
10:'창업 초기 기업의 판로 확보와 성장을 돕기 위해 창업기업 제품 구매를 촉진합니다.',
11:'환경부하를 줄이고 자원·에너지 효율을 높인 녹색제품의 구매를 촉진합니다.',
12:'국내에서 최초로 개발된 신기술 제품 중 정부 인증을 받은 신제품의 공공판로를 지원합니다.'};
const done=getProgress(); document.getElementById('counter').textContent=done.length+'/12'; document.getElementById('miniCount').textContent=done.length; document.getElementById('miniRing').style.setProperty('--p',(done.length/12*360)+'deg');
document.getElementById('collectionHeadline').textContent=done.length?done.length+'개의 제도를 발견했어요':'첫 발견을 시작해보세요';
const grid=document.getElementById('collectionGrid');
EPISODES.forEach(ep=>{ const got=done.includes(ep.id); const b=document.createElement('button'); b.className='collection-item '+(got?'unlocked':'locked'); b.innerHTML=`<span class="collection-no">${String(ep.id).padStart(2,'0')}</span><div class="collection-icon modern-collection-icon">${publicPurchaseIcon(ep.id,got)}</div><b>${got?ep.item:'미발견 아이템'}</b><small>${got?'핵심 제도 다시 보기':'AR 탐험에서 발견하세요'}</small>`; if(got)b.onclick=()=>openDetail(ep); grid.appendChild(b); });
const sheet=document.getElementById('itemSheet'); function openDetail(ep){ document.getElementById('detailIcon').innerHTML=publicPurchaseIcon(ep.id,true);document.getElementById('detailTag').textContent='ITEM '+String(ep.id).padStart(2,'0')+' / 12';document.getElementById('detailName').textContent=ep.item;document.getElementById('detailQuote').textContent='“'+ep.quote+'”';document.getElementById('detailLearn').textContent=learn[ep.id];sheet.classList.add('show');sheet.setAttribute('aria-hidden','false'); }
document.querySelectorAll('[data-close-sheet]').forEach(el=>el.onclick=()=>{sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');});
</script>
<script>document.addEventListener('click',e=>{const t=e.target.closest('.collection-card,.episode-card,.learn-card,button,a');if(t&&t.closest('main')){pushEvent('learn',{source:'collection'});}});</script>
</body></html>
