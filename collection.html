<style>
.collection-head-actions{display:flex;align-items:center;gap:10px;min-width:0}
.collection-audio-btn{appearance:none;-webkit-appearance:none;width:44px;height:44px;min-width:44px;padding:0;margin:0;border:0!important;outline:0;background:transparent!important;box-shadow:none!important;display:grid;place-items:center;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent}
.collection-audio-btn:focus,.collection-audio-btn:focus-visible,.collection-audio-btn:hover,.collection-audio-btn:active{border:0!important;outline:0;background:transparent!important;box-shadow:none!important}
.collection-audio-btn .speaker-system-icon{display:block;width:36px;height:36px;overflow:visible;color:#fff}
.collection-audio-btn .speaker-box{fill:none;stroke:currentColor;stroke-width:1.8}
.collection-audio-btn .speaker-cone{fill:none;stroke:currentColor;stroke-width:1.65}
.collection-audio-btn .speaker-core{fill:currentColor}
.collection-audio-btn .speaker-waves{display:none;stroke:#67e8f9;stroke-width:1.8;opacity:.9}
.collection-audio-btn.is-on .speaker-waves{display:block;animation:collectionHomeWave 1.35s ease-in-out infinite}
.collection-audio-btn.is-on .right-waves{animation-delay:.12s}
@keyframes collectionHomeWave{0%,100%{opacity:.28}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.collection-audio-btn.is-on .speaker-waves{animation:none}}
</style>

<script>
const learn = {
1:'공공기관의 구매력을 활용해 중소기업의 판로 확대와 경쟁력 강화를 지원하는 공공구매 영역입니다.',
2:'업력 7년 이내 초기 창업기업이 공공시장에서 첫 조달 실적을 쌓을 수 있도록 판로를 열어주는 제도입니다.',
3:'NET·NEP 등 기술개발 성과가 있는 제품의 시장 진입을 돕고 혁신적인 제품의 공공판로를 확대하는 제도입니다.',
4:'장애인이 소유하거나 경영에 참여하는 기업의 판로 확대와 경제활동을 지원하는 제도입니다.',
5:'근로 여건이 취약한 중증장애인의 직업재활과 일자리 확대를 위해 지정 생산시설의 제품을 우선 구매하는 제도입니다.',
6:'장애인 친화적인 시설과 정당한 임금을 갖춘 표준사업장의 제품을 구매해 모범적인 고용 모델을 지원합니다.',
7:'여성기업의 판로 확대를 위해 기업 요건과 제품·실적 인정기준을 확인해 구매하는 제도입니다.',
8:'사회적 목적을 추구하는 기업의 제품·서비스 구매를 통해 사회적 가치를 확산합니다.',
9:'영리를 목적으로 하지 않고 지역 주민의 복리 증진과 지역사회 문제 해결에 기여하는 협동조합의 제품을 지원합니다.',
10:'환경부하를 줄이고 자원·에너지 효율을 높인 녹색제품의 구매를 촉진합니다.',
11:'국가와 사회를 위해 헌신한 상이유공자 등이 운영하는 보훈기업의 제품 구매를 통해 예우를 실천합니다.',
12:'성능은 뛰어나지만 조달 실적이 없어 사장되기 쉬운 국산 혁신제품에 첫 공공판로 기회를 지원합니다.'};
const done=getProgress(); document.getElementById('counter').textContent=done.length+'/12'; document.getElementById('miniCount').textContent=done.length; document.getElementById('miniRing').style.setProperty('--p',(done.length/12*360)+'deg');
document.getElementById('collectionHeadline').textContent=done.length?done.length+'개의 제도를 발견했어요':'첫 발견을 시작해보세요';document.getElementById('discoveryRate').textContent='DISCOVERY '+discoveryPercent()+'%';
const grid=document.getElementById('collectionGrid');
EPISODES.forEach(ep=>{ const got=done.includes(ep.id),date=got?discoveryDate(ep.id):''; const b=document.createElement('button'); b.className='collection-item '+(got?'unlocked':'locked'); const rarity=got?JopamsLive.episodeRarity(ep.id):{key:'normal',name:'LOCKED',visits:0}; b.innerHTML=`<span class="collection-no">${String(ep.id).padStart(2,'0')}</span><span class="collection-state">${got?'DISCOVERED':'LOCKED'}</span><div class="collection-icon modern-collection-icon">${publicPurchaseIcon(ep.id,got)}</div><b>${got?ep.item:'???'}</b><small>${got?(date?date+' 발견 · '+rarity.visits+'회 기록':'핵심 제도 다시 보기'):'AR 탐험에서 발견하세요'}</small><span class="rarity-badge rarity-${rarity.key}">${rarity.name}</span>`; if(got)b.onclick=()=>openDetail(ep); grid.appendChild(b); });
const sheet=document.getElementById('itemSheet'); function openDetail(ep){ document.getElementById('detailIcon').innerHTML=publicPurchaseIcon(ep.id,true);document.getElementById('detailTag').textContent='ITEM '+String(ep.id).padStart(2,'0')+' / 12';document.getElementById('detailName').textContent=ep.item;document.getElementById('detailQuote').textContent='“'+ep.quote+'”';document.getElementById('detailLearn').textContent=learn[ep.id];sheet.classList.add('show');sheet.setAttribute('aria-hidden','false'); }
const masterLink=document.getElementById('masterLink'),masterTitle=document.getElementById('masterTitle'),masterDesc=document.getElementById('masterDesc');const mastery=JopamsLive.collectionMastery();masterLink.style.display=mastery.unlocked?'flex':'none';masterTitle.textContent=mastery.unlocked?'MASTER MODE 해금':'MASTER MODE 잠김';masterDesc.textContent=mastery.unlocked?'12개 제도 수집 완료 · 실제 사례형 테스트에 도전하세요':`${mastery.done}/12 발견 · 모두 수집하면 마스터 테스트가 열립니다`;
document.querySelectorAll('[data-close-sheet]').forEach(el=>el.onclick=()=>{sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');});
</script>
<script>document.addEventListener('click',e=>{const t=e.target.closest('.collection-card,.episode-card,.learn-card,button,a');if(t&&t.closest('main')){pushEvent('learn',{source:'collection'});}});</script>

<script>
(()=>{
 const audio=document.getElementById('collectionBgm');
 const btn=document.getElementById('collectionBgmBtn');
 if(!audio||!btn)return;
 const KEY='jopams_collection_bgm_on';
 const TARGET=.16;
 let fadeTimer=null;
 function setUI(on){
   btn.classList.toggle('is-on',on);
   btn.setAttribute('aria-pressed',String(on));
   btn.setAttribute('aria-label',on?'컬렉션 음악 끄기':'컬렉션 음악 켜기');
 }
 function fadeIn(){
   clearInterval(fadeTimer); audio.volume=.02;
   fadeTimer=setInterval(()=>{audio.volume=Math.min(TARGET,audio.volume+.02);if(audio.volume>=TARGET)clearInterval(fadeTimer)},90);
 }
 async function play(save=true){
   try{await audio.play();fadeIn();setUI(true);if(save)localStorage.setItem(KEY,'1')}
   catch(e){setUI(false)}
 }
 function stop(save=true){
   clearInterval(fadeTimer);audio.pause();setUI(false);if(save)localStorage.setItem(KEY,'0');
 }
 btn.addEventListener('click',()=>audio.paused?play(true):stop(true));
 const wanted=localStorage.getItem(KEY)==='1';
 setUI(wanted);
 if(wanted) play(false);
 document.addEventListener('visibilitychange',()=>{if(document.hidden){audio.pause()}else if(localStorage.getItem(KEY)==='1'){play(false)}});
})();
</script>
