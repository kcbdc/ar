<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 로그인</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/design-system-v18.css"><link rel="stylesheet" href="assets/design-system-v19.css"><script src="assets/auth.js"></script></head><body class="app-body auth-body"><main class="auth-shell"><section class="auth-hero"><span class="section-kicker">JOPAMS GO ACCOUNT</span><h1>조팸스 <em>GO</em></h1><p>한 번 로그인하면 다음 실행부터 바로 원정을 이어갑니다.<br>같은 계정으로 로그인하면 다른 기기에서도 진행률과 3일·12m 쿨다운이 이어집니다.</p></section><section class="auth-card premium-card"><h2>원정대 로그인</h2><p class="auth-help">최초 1회 소셜 로그인이 필요합니다.</p><button class="social-login kakao" id="kakaoLogin"><span>●</span><b>카카오로 시작하기</b></button><button class="social-login naver" id="naverLogin"><span>N</span><b>네이버로 시작하기</b></button><small class="auth-note">카메라 영상과 실시간 위치는 계정 서버에 저장하지 않습니다. 소셜 로그인 식별자는 게임 진행 동기화에 사용됩니다.</small><div id="authMsg" class="auth-msg"></div></section></main><script>
if(JopamsAuth.consumeCallback()){}
const q=new URLSearchParams(location.search),msg=document.getElementById('authMsg');
if(q.get('expired'))msg.textContent='로그인 유효기간이 만료되었습니다. 다시 로그인해 주세요.';
if(q.get('loggedout'))msg.textContent='로그아웃되었습니다.';
if(q.get('error'))msg.textContent='일시적인 오류가 발생했습니다. 다시 로그인해 주세요.';
kakaoLogin.onclick=()=>JopamsAuth.login('kakao');naverLogin.onclick=()=>JopamsAuth.login('naver');
// v58: 기존 토큰 검증 중에는 버튼을 잠깐 비활성화해 사용자가 헷갈리지 않게 하고,
// 검증이 느리거나 실패하더라도(서버 지연/오류) 반드시 로그인 버튼이 있는 상태로
// 되돌아오도록 finally에서 항상 복구한다.
if(JopamsAuth.token()){
  kakaoLogin.disabled=true;naverLogin.disabled=true;
  msg.textContent='로그인 확인 중…';
  JopamsAuth.verify().then(u=>{
    if(u){location.replace('index.html');return}
    msg.textContent='';
  }).catch(()=>{msg.textContent='';}).finally(()=>{
    kakaoLogin.disabled=false;naverLogin.disabled=false;
  });
}
</script></body></html>
