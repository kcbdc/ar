<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142b"><title>조팸스 GO | 업적</title><link rel="stylesheet" href="assets/style.css"></head><body class="app-body"><main class="app-shell ranking-shell"><header class="sub-header"><a href="index.html" class="back-btn" aria-label="뒤로가기">←</a><div><small>JOPAMS GO</small><h1>업적 · 배지</h1></div><span id="badgeStat">0/7</span></header><section class="badge-hero premium-card"><div class="badge-orb">✦</div><div><span>EXPEDITION BADGES</span><b id="badgeHero">0개 획득</b><small>탐험·학습·미니게임 기록으로 배지를 완성하세요.</small></div></section><section class="badge-grid" id="badgeGrid"></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><b>홈</b></a><a href="ar.html"><span>◎</span><b>탐험</b></a><a href="checkpoints.html"><span>⌖</span><b>지도</b></a><a href="collection.html"><span>◇</span><b>컬렉션</b></a><a href="ranking.html"><span>♛</span><b>랭킹</b></a></nav><script src="assets/app.js"></script><script>checkAchievements(false);const a=earnedAchievements(),n=a.filter(x=>x.earned).length;badgeStat.textContent=n+'/7';badgeHero.textContent=n+'개 획득';badgeGrid.innerHTML=a.map(x=>`<article class="badge-card ${x.earned?'earned':''}"><div class="badge-icon">${x.earned?x.icon:'?'}</div><span>${x.earned?'UNLOCKED':'LOCKED'}</span><b>${x.name}</b><small>${x.desc}</small></article>`).join('');</script></body></html>
